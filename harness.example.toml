# Agent Harness 配置示例
# 复制到 ~/.agent-harness/config.toml 后按需修改。
# 密钥两种写法：① 只写「从哪个环境变量读」（api_key_env，默认）② 直写 api_key（明文落盘——写了优先）

[model]
default = "deepseek-flash"  # 当前使用哪个 profile——必须是下面某个 [models.*] 的名字（CLI --model 可临时覆盖）

# ---- 模型 profiles（OpenAI 兼容：换 base_url / api_key_env / name 即可接厂商或中转站）----

[models.deepseek-flash]
name = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
# api_key = "sk-..."        # 可直写（明文——别把 key 提交进仓库；写了优先于上面的 env）
temperature = 1.0           # ⚠️ 思考模式下不生效（官方：不报错、静默忽略）
thinking = "enabled"        # DeepSeek 私有：开关——"enabled" / "disabled" / "off"（off = 不传）
# strip_think_tags = true   # 正文里包 <mm:think>…</mm:think> 的网关才开（MiniMax 形态；默认关）
reasoning_effort = "high"   # DeepSeek 私有：强度——"low" / "high" / "max"；"off" = 不传
vision = "auto"             # 能不能看图：auto（发一次看报错）/ true / false。
                            # deepseek-flash 支持；deepseek-v4-pro 不支持（会 400）

# 示例：其他厂商 / 中转站（OpenAI 兼容——取消注释即可用）。
# [models.某厂商-大]
# name = "厂商的模型名"                    # 发给 API 的 model 字段（中转站代理谁写谁）
# base_url = "https://厂商的OpenAI兼容端点/v1"
# api_key_env = "对应的环境变量名"
# temperature = 0.7
# [models.某厂商-小]                       # 同厂商第二个模型——照抄，只换 name
# name = "厂商的另一个模型名"
# base_url = "https://厂商的OpenAI兼容端点/v1"
# api_key_env = "对应的环境变量名"
# ⚠️ name / base_url / api_key_env 不写 ≠ 继承厂商——会落到 ModelProfile 的默认值（DeepSeek 那套）
# 不写 thinking / reasoning_effort = 一个 DeepSeek 私有参数都不带（跨厂商安全）
# 厂商也有思考参数时：名字和取值恰好和 DeepSeek 一样才直接写（OpenAI 是 low/medium/high，无 max→会被校验成 off）

# ---- 全局（与模型无关）----

[loop]
max_steps = 40            # 一轮最多走多少个「模型回合」（不是工具调用数）
approval_timeout = 300    # 秒：审批没人答复就按驳回（0 = 一直等）

[context]
compact_threshold = 300000   # 软阈值（字符当量）——超了触发微压缩；太低会过早压缩、打断缓存
keep_last = 5               # 微压缩保留最近 N 条工具结果
snip_keep_groups = 3        # reactive 丢中间时保留最近 K 组

[server]
host = "127.0.0.1"
port = 8000

[web]
autostart = true            # 进 TUI 时自动拉起网页端（后端 + 前端 dev server）——已在跑的不重复拉
stop_on_exit = true         # 退 TUI 时收掉这次自己拉起的进程；false = 网页端活得比 TUI 久
stop_wait = 120             # 收之前先等网页上正在跑的那一轮跑完（秒）；0 = 不等，直接关

[trace]
enabled = true              # false = 不写轨迹文件（session 仍在，只是没有"给人看的账"）

[guardrail]
# 这些命令不再问人（前缀语义：`git *` = 以 git 开头的任何命令；不带 * 就是精确匹配）。
# catastrophic 档（format / mkfs / dd / rm -rf /）不受这里影响。
allow = []
# allow = ["git *", "uv *", "rg *", "pytest *"]

[search]
# 联网搜索。auto = 当前 profile 是 DeepSeek 就用 DeepSeek 的 Search API（复用模型那把 key），
# 否则看环境里有没有 TAVILY_API_KEY，都没有就不开（工具不会出现在菜单里）。
provider = "auto"           # auto | deepseek | tavily | brave | searxng | off
max_results = 5
snippet_budget = 1500       # 摘要总预算（字符），按条数均分：5 条 → 每条 300
# api_key_env = "TAVILY_API_KEY"   # 空 = 按 provider 约定（tavily→TAVILY_API_KEY，brave→BRAVE_API_KEY）
# searxng_url = "http://localhost:8080"   # provider = "searxng" 时必填

[tools]
# 看图用哪个 profile（空 = 用当前模型）。主模型是推理型、看不了图时，指一个有视觉的。
vision_profile = ""
