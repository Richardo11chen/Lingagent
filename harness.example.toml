# Agent Harness 配置示例
# 复制到 ~/.agent-harness/config.toml 后按需修改。
# 密钥两种写法：① 只写「从哪个环境变量读」（api_key_env，默认）② 直写 api_key（明文落盘——写了优先）

[model]
default = "deepseek-flash"  # 当前使用哪个 profile——必须是下面某个 [models.*] 的名字（CLI --model 可临时覆盖）

# ---- 模型 profiles（OpenAI 兼容：换 base_url / api_key_env / name 即可接厂商或中转站）----

[models.deepseek-flash]
name = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
# api_key = "sk-..."        # 可直写（明文——别把 key 提交进仓库；写了优先于上面的 env）
temperature = 1.0           # ⚠️ 思考模式下不生效（官方：不报错、静默忽略）
thinking = "enabled"        # DeepSeek 私有：开关——"enabled" / "disabled" / "off"（off = 不传）
reasoning_effort = "high"   # DeepSeek 私有：强度——"low" / "high" / "max"；"off" = 不传

# 示例：其他厂商 / 中转站（OpenAI 兼容——取消注释即可用）。
# [models.某厂商-大]
# name = "厂商的模型名"                    # 发给 API 的 model 字段（中转站代理谁写谁）
# base_url = "https://厂商的OpenAI兼容端点/v1"
# api_key_env = "对应的环境变量名"
# temperature = 0.7
# [models.某厂商-小]                       # 同厂商第二个模型——照抄，只换 name
# name = "厂商的另一个模型名"
# base_url = "https://厂商的OpenAI兼容端点/v1"
# api_key_env = "对应的环境变量名"
# ⚠️ name / base_url / api_key_env 不写 ≠ 继承厂商——会落到 ModelProfile 的默认值（DeepSeek 那套）
# 不写 thinking / reasoning_effort = 一个 DeepSeek 私有参数都不带（跨厂商安全）
# 厂商也有思考参数时：名字和取值恰好和 DeepSeek 一样才直接写（OpenAI 是 low/medium/high，无 max→会被校验成 off）

# ---- 全局（与模型无关）----

[loop]
max_steps = 40   # 一轮最多走多少个「模型回合」（不是工具调用数）

[context]
compact_threshold = 70000   # 软阈值（字符当量）——超了触发微压缩
keep_last = 5               # 微压缩保留最近 N 条工具结果
snip_keep_groups = 3        # reactive 丢中间时保留最近 K 组

[server]
host = "127.0.0.1"
port = 8000

[web]
autostart = true            # 进 TUI 时自动拉起网页端（后端 + 前端 dev server）——已在跑的不重复拉
