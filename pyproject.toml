[project]
name = "lingagent"
version = "0.1.0"
description = "A coding-agent harness: LLM decides, the harness dispatches tools, guards and logs"
readme = "README.md"
authors = [
    { name = "ypchen", email = "3311614415@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.8.0",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "uvicorn>=0.53.0",
    "wcwidth>=0.2.13",
    "websockets>=17.2",
]

[project.scripts]
lingagent = "agent_harness:main"
linga = "agent_harness:main"  # 短名字：装完在任意目录 `linga` 就能开工
lingagent-web = "agent_harness.server:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

# 发行名是 lingagent，但导入包名仍是 agent_harness——uv_build 默认按发行名猜模块，这里点明。
[tool.uv.build-backend]
module-name = "agent_harness"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 单测卡住就失败，别无限等（2026-10-22 真撞过：test_s6b 等一个永远不来的 WS 消息，
# 外层 shell 被杀后 pytest 成了幽灵进程）
timeout = 60
