[project]
name = "lingagent"
version = "0.2.0"
description = "A coding-agent harness: LLM decides, the harness dispatches tools, guards and logs"
readme = "README.md"
license = "MIT"
authors = [
    { name = "ypchen", email = "3311614415@qq.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
# 3.11 是真实下限：代码只用到 tomllib（3.11 起进标准库）和 `X | Y` 标注（3.10 起）。
# 3.14 是本机开发版本，不是技术约束——CI 矩阵两头都跑，这句声明才有证据。
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "uvicorn>=0.53.0",
    "wcwidth>=0.2.13",
    "websockets>=17.2",
]

[project.urls]
Homepage = "https://github.com/Richardo11chen/Lingagent"
Repository = "https://github.com/Richardo11chen/Lingagent"

[project.scripts]
# 一个入口，靠 -tui / -web 分派：lingan（默认 TUI）、lingan -tui、lingan -web
lingan = "agent_harness.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

# 发行名是 lingagent，但导入包名仍是 agent_harness——uv_build 默认按发行名猜模块，这里点明。
[tool.uv.build-backend]
module-name = "agent_harness"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# 起步只上"能抓到真问题、几乎不误报"的那几组：
#   E/F/W = pycodestyle + pyflakes（未用导入、未定义名、重定义）
#   I     = import 排序；UP = pyupgrade（3.11 起该用 collections.abc.Callable 等）
#   B     = bugbear（循环里闭包抓变量、except 里 raise 不带 from…）
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 工具描述是整段中文 prompt（本身就是数据），按 120 列硬断会把它拆碎
"src/agent_harness/schema.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 单测卡住就失败，别无限等（2026-10-22 真撞过：test_s6b 等一个永远不来的 WS 消息，
# 外层 shell 被杀后 pytest 成了幽灵进程）
timeout = 60
